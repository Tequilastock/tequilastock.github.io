<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Thanks! – customsoftware</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#007aff" />
    <style>
      :root {
        --accent: #007aff;
        --light: #f5f5f7;
        --txt: #1d1d1f;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font:
          20px/1.6 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        display: grid;
        place-items: center;
        height: 100vh;
        background: var(--light);
        color: var(--txt);
      }
      main {
        text-align: center;
        padding: 2rem;
      }
      a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }
      .cta {
        display: inline-block;
        margin-top: 2rem;
        padding: 0.9rem 2.4rem;
        background: var(--accent);
        color: #fff;
        border-radius: 42px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Thank&nbsp;you&nbsp;✓</h1>
      <p>Your message is on its way. We’ll respond within one business day.</p>
      <a class="cta" href="/">Back&nbsp;to&nbsp;home</a>
    </main>
  </body>
</html>
