<!doctype html><html lang="en"><head>
<meta charset="utf-8"><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
<title>Game Demos – customsoftware</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--accent:#007aff;--light:#f5f5f7;--txt:#1d1d1f}
*{box-sizing:border-box;margin:0;padding:0}
body{font:18px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--light);color:var(--txt);}
header{padding:6vh 5%;text-align:center}header h1{font-size:2.4rem;margin-bottom:.4rem}
.grid{display:flex;flex-wrap:wrap;gap:3rem;justify-content:center;padding:0 5% 10vh}
.card{background:#000;border-radius:24px;width:100%;max-width:360px;box-shadow:0 10px 25px rgba(0,0,0,.25);overflow:hidden;position:relative}
.card iframe{display:block;width:100%;height:auto;border:none}
.card h3{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:#000a;color:#fff;padding:.25rem .8rem;border-radius:12px;font-size:.9rem}
nav a{color:var(--accent);text-decoration:none}
</style></head><body>
<header>
  <h1>Interactive Tech Demos</h1>
  <p><nav><a href="../index.html">← Back to main site</a></nav></p>
</header>
<div class="grid">
  <div class="card"><iframe loading="lazy" src="flappy.html?v=1"" title="Flappy Bird"></iframe><h3>Flappy Bird</h3></div>
  <div class="card"><iframe loading="lazy" src="snake.html?v=1""  title="Snake"></iframe><h3>Snake</h3></div>
  <div class="card"><iframe loading="lazy" src="tetris.html?v=1"" title="Tetris"></iframe><h3>Tetris</h3></div>
</div>
</body></html>
