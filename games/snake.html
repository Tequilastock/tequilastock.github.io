<!doctype html><html lang="en"><head>
<meta charset="utf-8"><title>Snake – customsoftware demo</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;display:flex;flex-direction:column;align-items:center;background:#222;color:#fff;font:17px monospace}
canvas{background:#000;margin-top:1.2rem;width:100%;max-width:400px;height:auto}
button{margin-top:.7rem;padding:.6rem 1.4rem;border:none;border-radius:12px;background:#007aff;color:#fff;font-weight:600;cursor:pointer}
a{color:#0f0;text-decoration:none;margin-top:1rem}
#snd{position:fixed;top:12px;left:12px;background:#0008;color:#fff;border:none;border-radius:8px;padding:.3rem .6rem;cursor:pointer;z-index:10}

/* --- touch D-pad (shown only on coarse pointers) --- */
#pad{display:none}@media (pointer:coarse){#pad{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);
 gap:6px;margin-top:1rem}}
.padBtn{background:#333;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:#0f0;user-select:none}
.padBtn:active{background:#0f0;color:#000}
.padBtn[aria-hidden="true"]{opacity:0;pointer-events:none}
</style></head><body>

<button id="snd" aria-label="toggle sound">🔈</button>
<h1>Snake</h1>

<canvas id="cv" width="400" height="400"></canvas>
<p id="score">Score 0 | Best 0</p>
<button id="reset">Reset</button>

<!-- Touch D-pad -->
<div id="pad">
  <div class="padBtn" aria-hidden="true"></div>
  <div class="padBtn" data-dir="up">▲</div>
  <div class="padBtn" aria-hidden="true"></div>
  <div class="padBtn" data-dir="left">◀</div>
  <div class="padBtn" data-dir="down">▼</div>
  <div class="padBtn" data-dir="right">▶</div>
  <div class="padBtn" aria-hidden="true"></div>
</div>

<p style="font-size:.85rem;opacity:.7">Arrows / D-pad move · P pause</p>
<a href="../index.html">← Back</a>

<script>
/* ---------- sound toggle ---------- */
let audioCtx,on=!JSON.parse(localStorage.snakeSound||'true');
function ping(){if(!on)return;
  audioCtx||(audioCtx=new(window.AudioContext||window.webkitAudioContext)());
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.frequency.value=660;o.connect(g).connect(audioCtx.destination);
  g.gain.setValueAtTime(.3,audioCtx.currentTime);o.start();o.stop(audioCtx.currentTime+.12);}
const sndBtn=document.getElementById('snd');
sndBtn.onclick=()=>{on=!on;sndBtn.textContent=on?'🔈':'🔇';localStorage.snakeSound=on};

/* ---------- game logic ---------- */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),size=20,cells=cv.width/size;
let snake,dir,food,score,playing,paused=false,high=+(localStorage.snakeHigh||0);
const scoreEl=document.getElementById('score');
function rnd(){return Math.floor(Math.random()*cells)}
function placeFood(){food=[rnd(),rnd()]}
function updateScore(){scoreEl.textContent=`Score ${score} | Best ${high}`}
function reset(){snake=[[10,10]];dir=[1,0];score=0;playing=true;paused=false;placeFood();updateScore()}
function step(){
  if(!playing||paused)return;
  const head=[snake[0][0]+dir[0],snake[0][1]+dir[1]];
  if(head[0]<0||head[1]<0||head[0]>=cells||head[1]>=cells||
     snake.some(s=>s[0]===head[0]&&s[1]===head[1])){
    playing=false;if(score>high){high=score;localStorage.snakeHigh=high}updateScore();return;}
  snake.unshift(head);
  if(head[0]===food[0]&&head[1]===food[1]){score++;updateScore();placeFood();ping()}
  else snake.pop();
}
function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#0f0';snake.forEach(([x,y])=>ctx.fillRect(x*size,y*size,size-2,size-2));
  ctx.fillStyle='#f00';ctx.fillRect(food[0]*size,food[1]*size,size-2,size-2);
}
function loop(){step();draw();setTimeout(loop,100)}

/* keyboard */
addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'   && dir[1]!==1) dir=[0,-1];
  if(e.key==='ArrowDown' && dir[1]!==-1)dir=[0,1];
  if(e.key==='ArrowLeft' && dir[0]!==1) dir=[-1,0];
  if(e.key==='ArrowRight'&& dir[0]!==-1)dir=[1,0];
  if(e.key==='p'||e.key==='P')paused=!paused;
});

/* touch D-pad */
document.querySelectorAll('.padBtn[data-dir]').forEach(btn=>{
  btn.addEventListener('touchstart',e=>{
    e.preventDefault();const d=btn.dataset.dir;
    if(d==='up'   && dir[1]!==1) dir=[0,-1];
    if(d==='down' && dir[1]!==-1)dir=[0,1];
    if(d==='left' && dir[0]!==1) dir=[-1,0];
    if(d==='right'&& dir[0]!==-1)dir=[1,0];
  },{passive:false});
});

/* buttons */
document.getElementById('reset').onclick=reset;
reset();loop();
</script>
</body></html>
